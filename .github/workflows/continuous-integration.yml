name: "Continuous Integration"

on:
  pull_request:
    branches:
      - "*.x"
      - "main"
  push:
    branches:
      - "*.x"
      - "main"

jobs:
  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }}, ORM ${{ matrix.orm-version }}, ${{ matrix.dependencies }})"
    runs-on: "ubuntu-latest"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.4"
          - "8.5"
        dependencies:
          - "highest"
          - "lowest"
        orm-version:
          - "2.20.9"
          - "3.0.0"
          - "^3.0"
        exclude:
          # doctrine-laminas-hydrator supports PHP 8.5 only from 3.7.0, which
          # requires doctrine/persistence ^4; ORM 2.20.9 and 3.0.0 do not
          # allow persistence ^4, so they cannot be installed on PHP 8.5
          - php-version: "8.5"
            orm-version: "2.20.9"
          - php-version: "8.5"
            orm-version: "3.0.0"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v2"
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "pcov"
          ini-values: "zend.assertions=1"
          extensions: "pdo_mysql"

      - name: "Require Doctrine ORM ${{ matrix.orm-version }}"
        run: composer require --no-update --no-interaction "doctrine/orm:${{ matrix.orm-version }}"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v1"
        with:
          dependency-versions: "${{ matrix.dependencies }}"
          composer-options: "--prefer-dist"

      - name: "Show Composer packages"
        run: "composer show"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit --coverage-clover=coverage.xml"

      - name: "Upload coverage file"
        uses: "codecov/codecov-action@v4"
        with:
          name: "phpunit-${{ matrix.php-version }}-${{ matrix.dependencies }}-orm-${{ matrix.orm-version }}.coverage"
          files: "./coverage.xml"

  upload_coverage:
    name: "Upload coverage to Codecov"
    runs-on: "ubuntu-latest"
    needs:
      - "phpunit"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v2"
        with:
          fetch-depth: 2

      - name: "Download coverage files"
        uses: "actions/download-artifact@v4"
        with:
          path: "reports"

      - name: "Upload to Codecov"
        uses: "codecov/codecov-action@v2"
        with:
          directory: "reports"
